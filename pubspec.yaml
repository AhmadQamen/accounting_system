name: accounting_system
description: Offline-first simple accounting, inventory and cash management app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  dio: ^5.8.0
  dartz: ^0.10.1
  connectivity_plus: ^6.1.0
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  intl: ^0.20.0
  loading_animation_widget: ^1.3.0
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.0
  shimmer: ^3.0.0
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.4
  timeago: ^3.7.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
